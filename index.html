<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Wedding</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- ===== HERO — 5 Parallax Sets ===== -->
    <section class="hero" id="hero">
        <div class="hero-inner">

            <div class="parallax-set" data-speed="0.08">
                <div class="svg-slot back" data-label="1 Back">
                    <!-- Replace with your SVG -->
                </div>
                <div class="svg-slot front" data-label="1 Front">
                    <!-- Replace with your SVG -->
                </div>
            </div>

            <div class="parallax-set" data-speed="0.20">
                <div class="svg-slot back" data-label="2 Back">
                </div>
                <div class="svg-slot front" data-label="2 Front">
                </div>
            </div>

            <div class="parallax-set" data-speed="0.35">
                <div class="svg-slot back" data-label="3 Back">
                </div>
                <div class="svg-slot front" data-label="3 Front">
                </div>
            </div>

            <div class="parallax-set" data-speed="0.50">
                <div class="svg-slot back" data-label="4 Back">
                </div>
                <div class="svg-slot front" data-label="4 Front">
                </div>
            </div>

            <div class="parallax-set" data-speed="0.65">
                <div class="svg-slot back" data-label="5 Back">
                </div>
                <div class="svg-slot front" data-label="5 Front">
                </div>
            </div>

        </div>
    </section>

    <!-- ===== MAIN LAYOUT ===== -->
    <div class="content-wrapper">

        <!-- Sticky Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-sticky">

                <!-- Champagne Bottle -->
                <div class="bottle-wrapper" id="bottleWrapper">
                    <svg class="bottle-svg" viewBox="0 0 70 200" xmlns="http://www.w3.org/2000/svg">
                        <!-- Foil cap -->
                        <rect x="28" y="0" width="14" height="14" rx="2"
                              fill="#C9B037" stroke="#A89020" stroke-width="0.5"/>
                        <!-- Cage wires -->
                        <line x1="31" y1="14" x2="31" y2="19" stroke="#C9B037" stroke-width="0.5"/>
                        <line x1="39" y1="14" x2="39" y2="19" stroke="#C9B037" stroke-width="0.5"/>
                        <!-- Neck + shoulder + body as one shape -->
                        <path d="
                            M30,14 L30,52
                            Q30,58 28,63
                            Q18,76 15,92
                            L15,180
                            Q15,196 35,196
                            Q55,196 55,180
                            L55,92
                            Q52,76 42,63
                            Q40,58 40,52
                            L40,14 Z"
                            fill="#2D5016" stroke="#1B3A0A" stroke-width="0.8"/>
                        <!-- Label -->
                        <rect x="20" y="108" width="30" height="42" rx="2"
                              fill="#FBF6E9" stroke="#C9B037" stroke-width="0.5"/>
                        <line x1="24" y1="119" x2="46" y2="119" stroke="#C9B037" stroke-width="0.4"/>
                        <line x1="26" y1="125" x2="44" y2="125" stroke="#C9B037" stroke-width="0.3"/>
                        <line x1="24" y1="131" x2="46" y2="131" stroke="#C9B037" stroke-width="0.4"/>
                        <!-- Highlight -->
                        <path d="M19,94 L19,178" fill="none"
                              stroke="rgba(255,255,255,0.12)" stroke-width="3.5" stroke-linecap="round"/>
                    </svg>
                </div>

                <!-- Champagne Glass -->
                <div class="glass-wrapper">
                    <svg class="glass-svg" viewBox="0 0 100 240" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <!-- Bowl interior clip for liquid -->
                            <clipPath id="bowl-clip">
                                <path d="M25,30 L39,138 Q50,148 61,138 L75,30 Z"/>
                            </clipPath>
                            <!-- Champagne gradient -->
                            <linearGradient id="champagne-grad" x1="0" y1="1" x2="0" y2="0">
                                <stop offset="0%"   stop-color="#C8960F"/>
                                <stop offset="35%"  stop-color="#E2B93B"/>
                                <stop offset="100%" stop-color="#F7E7CE"/>
                            </linearGradient>
                        </defs>

                        <!-- Liquid + bubbles (clipped to bowl) -->
                        <g clip-path="url(#bowl-clip)">
                            <rect id="liquidFill" x="0" y="138" width="100" height="0"
                                  fill="url(#champagne-grad)" opacity="0.88"/>
                            <g id="bubblesGroup"></g>
                        </g>

                        <!-- Glass bowl outline -->
                        <path d="M23,28 L38,138 Q50,150 62,138 L77,28"
                              fill="none" stroke="rgba(185,185,185,0.72)" stroke-width="1.6"/>
                        <!-- Rim ellipse -->
                        <ellipse cx="50" cy="28" rx="27" ry="4"
                                 fill="none" stroke="rgba(200,200,200,0.45)" stroke-width="1"/>
                        <!-- Stem -->
                        <rect x="47" y="147" width="6" height="64" rx="2"
                              fill="rgba(185,185,185,0.45)"/>
                        <!-- Base -->
                        <ellipse cx="50" cy="215" rx="24" ry="6"
                                 fill="none" stroke="rgba(185,185,185,0.65)" stroke-width="1.6"/>
                        <ellipse cx="50" cy="215" rx="24" ry="3"
                                 fill="rgba(185,185,185,0.10)"/>
                    </svg>
                </div>

            </div>
        </aside>

        <!-- Main Content Panel -->
        <main class="main-content" id="mainContent">
            <div class="content-placeholder">
                <p>Content coming soon&hellip;</p>
            </div>
        </main>

    </div>

    <script src="script.js"></script>
</body>
</html>
